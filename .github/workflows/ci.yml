name: Tests and security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Python syntax
        run: python -m compileall -q app
      - name: Dependency vulnerabilities
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - name: Static security scan
        run: python -m bandit -r app -lll -q
      - name: Repository secrets and data
        run: python scripts/check_repository_safety.py
      - name: Container build
        run: docker build --tag go-to-russia:ci .

  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure restricted SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/uniroute_deploy"
          install -m 600 .github/deploy_known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/uniroute_deploy"
      - name: Deploy tested commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | ssh -T \
            -i "$HOME/.ssh/uniroute_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "uniroute-deploy@${DEPLOY_HOST}"
