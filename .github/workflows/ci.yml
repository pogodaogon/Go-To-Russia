name: Tests and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Python syntax
        run: python -m compileall -q app
      - name: Dependency vulnerabilities
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - name: Static security scan
        run: python -m bandit -r app -lll -q
      - name: Repository secrets and data
        run: python scripts/check_repository_safety.py
      - name: Container build
        run: docker build --tag go-to-russia:ci .
